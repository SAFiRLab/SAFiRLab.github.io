<section class="hero is-medium is-bold site-hero" {% if page.hero_image %}style="background-image: linear-gradient(180deg, rgba(14,31,51,.55), rgba(14,31,51,.85)), url('{{ page.hero_image | relative_url }}');"{% endif %}>
    <div class="hero-body">
        <div class="container">
            <h1 class="title is-2">{{ page.title }}</h1>
            {% if page.subtitle %}
            <p class="subtitle is-4">{{ page.subtitle }}</p>
            {% endif %}
            {% if page.hero_link %}
            <a href="{{ page.hero_link | relative_url }}" class="button is-safir is-medium">{{ page.hero_link_text }}</a>
            {% endif %}
            {% if page.hero_link2 %}
            <a href="{{ page.hero_link2 | relative_url }}" class="button is-safir is-medium">{{ page.hero_link_text2 }}</a>
            {% endif %}
        </div>
    </div>
</section>
